# 本地开发环境：java -jar ... --spring.profiles.active=dev
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:inventory}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true
  data:
    redis:
      host: ${REDIS_HOST:localhost}

logging:
  level:
    com.enterprise: DEBUG
    com.enterprise.common.log.aspect.WebLogAspect: DEBUG
    com.baomidou.mybatisplus: WARN

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
