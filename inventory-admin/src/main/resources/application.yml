server:
  # Render 等平台注入 PORT（默认 10000）优先；本地/Compose 未注入时回落 8080
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 100

spring:
  application:
    name: inventory-system
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    allow-circular-references: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认连本机 MySQL；TiDB Cloud 等云端数据库通过 MYSQL_JDBC_URL 传入完整 URL 覆盖
    url: ${MYSQL_JDBC_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:inventory}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&rewriteBatchedStatements=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: ${MYSQL_MAX_POOL_SIZE:20}
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 30000
      connection-test-query: SELECT 1
      # 云数据库（TiDB Cloud 服务端为 UTC）需要把会话时区统一为东八区，
      # 保证 CURRENT_TIMESTAMP / ON UPDATE CURRENT_TIMESTAMP 与本机 MySQL 行为一致
      connection-init-sql: ${MYSQL_INIT_SQL:SET time_zone = '+08:00'}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5s
      ssl:
        enabled: ${REDIS_SSL:false}
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_MAX_ACTIVE:32}
          max-idle: ${REDIS_MAX_IDLE:16}
          min-idle: ${REDIS_MIN_IDLE:4}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.enterprise.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      insert-strategy: not_null
      update-strategy: not_null

# ---------------------------------------------------------------- 应用自定义配置
inventory:
  security:
    api-permission-check: true
    allow-concurrent-login: true
    ignore-urls:
      - /api/auth/login
      - /api/auth/captcha
      - /doc.html
      - /webjars/**
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-resources/**
      - /actuator/health
      - /actuator/info
      - /favicon.ico
      - /error
    jwt:
      secret: ${JWT_SECRET:inventory-system-default-jwt-secret-please-change-in-production-2026}
      access-token-validity: ${JWT_TTL:8h}
      issuer: inventory-system
  cache:
    ttl: 30m
    null-ttl: 2m
    cache-null: true
    jitter: 5m
    mutex-on-miss: true
    double-delete-delay-ms: 500
  redis:
    # Redisson（分布式锁）连接池，复用 REDIS_* 变量：托管 Redis（如 Render Key Value 25MB 免费档）连接数有限，需调小
    redisson-pool-size: ${REDIS_MAX_ACTIVE:32}
    redisson-min-idle: ${REDIS_MIN_IDLE:4}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  notify:
    in-app-enabled: true
    email-enabled: ${NOTIFY_EMAIL_ENABLED:false}
    webhook-enabled: ${NOTIFY_WEBHOOK_ENABLED:false}
    webhook-url: ${NOTIFY_WEBHOOK_URL:}
    webhook-secret: ${NOTIFY_WEBHOOK_SECRET:change-me}
    from: noreply@inventory.local
  job:
    order-timeout-cron: "0 0 * * * ?"
    low-stock-cron: "0 */30 * * * ?"
    daily-stat-cron: "0 10 0 * * ?"
    cleanup-cron: "0 0 3 * * ?"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    # 未配置 SMTP 时邮件通知默认关闭，但 spring-boot-starter-mail 仍会注册 MailHealthIndicator，
    # 它会因连不上 localhost:587 把整体健康状态拖成 DOWN，导致容器健康检查误判。
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.enterprise: INFO
  config: classpath:logback-spring.xml
