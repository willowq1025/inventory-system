# ==============================================================================
# 云上镜像构建：GitHub Actions 构建前后端 Docker 镜像并推送 GHCR
#   ghcr.io/<owner>/inventory-backend:main  —— Spring Boot 后端（多模块 Maven 构建）
#   ghcr.io/<owner>/inventory-web:main      —— Vue3 SPA + Nginx 前端
# Render 以 runtime: image 部署这两个镜像（免费档构建内存不足，故在 Actions 构建）。
# 可选：配置 RENDER_DEPLOY_HOOK_BACKEND / RENDER_DEPLOY_HOOK_WEB 仓库 secret 后，
# 镜像推送成功会自动触发 Render 滚动更新。
# ==============================================================================
name: Build & Push Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend image (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inventory-backend:main
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Trigger Render deploy (optional)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK" || echo "deploy hook skipped"

  web:
    name: Web image (Vue3 + Nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inventory-web:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Trigger Render deploy (optional)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsS -X POST "$HOOK" || echo "deploy hook skipped"
